[project]
name = "cs-ui"
version = "0.2.0"
description = "A Python UI framework inspired by Flet"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Shawn Chen", email = "cs@cstos.com" }]
dependencies = [
    "flet[all]>=1.1.2,<1.2",
    "flet-charts",
]

# ui-mcp（给 AI agent 的组件库 MCP 服务）是可选能力：装它不影响 ui 本身的使用。
[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.urls]
Homepage = "https://www.github.com/icstos/cs-ui"
Repository = "https://www.github.com/icstos/cs-ui"
Documentation = "https://www.github.com/icstos/cs-ui"
Issues = "https://www.github.com/icstos/cs-ui/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "ui" = "src/ui", "ui_mcp" = "src/ui_mcp" }
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]   # 从 src 目录开始查找
include = ["ui*"] # 匹配顶层包名 + 所有子包（*通配符）

# 索引产物随包分发（和 flet-mcp 一样：装完即用，不需要额外构建步骤）
# ui/data/fonts：内置字体必须随 wheel 走。运行时 page.fonts 指向的是**包内**的字体
# 文件（见 ui/core/fonts.py），漏打包的后果是"开发环境有字体、装出来的程序没有"。
[tool.setuptools.package-data]
ui = ["data/fonts/*"]
ui_mcp = ["data/*.json"]

# [tool.setuptools.package-dir]
# ui = "cs_ui"
[project.scripts]
ui-mcp = "ui_mcp.cli:main"
moss-tts-nano = "ui.cli:main"
